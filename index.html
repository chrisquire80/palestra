<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#10110e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Palestra">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Palestra</title>
  <style>
    :root {
      --bg: #10110e;
      --card: #1b1d17;
      --card-2: #24271f;
      --line: rgba(244, 240, 230, 0.14);
      --ink: #f4f0e6;
      --muted: #b3ad9f;
      --faint: #8d877a;
      --red: #ff4d2e;
      --red-ink: #2a0904;
      --chalk: #d6ef6a;
      --down: #ffb199;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 420px at 50% -10%, rgba(255, 77, 46, 0.18), transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.35;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button, input { -webkit-tap-highlight-color: transparent; }
    .shell {
      width: min(560px, 100%);
      margin: 0 auto;
      padding: calc(12px + env(safe-area-inset-top)) 16px 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .plate {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, var(--ink) 0 16%, transparent 17%),
        radial-gradient(circle at 50% 50%, var(--red) 0 58%, transparent 59%),
        radial-gradient(circle at 50% 50%, var(--bg) 0 72%, var(--red) 73% 100%);
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.35);
      flex: none;
    }
    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 1.55rem; letter-spacing: -0.03em; }
    .ghost, .text-btn, .step, .icon-btn, .choice, .primary, .secondary {
      border: 0;
      background: transparent;
    }
    .ghost {
      min-height: 44px;
      min-width: 44px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }
    .banner {
      margin: 0 0 8px;
      padding: 8px 12px;
      border-radius: 16px;
      background: #2a2418;
      color: #f3e6c4;
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 0.92rem;
    }
    .banner p { margin: 0; }
    .banner button { min-height: 44px; padding: 0 10px; }
    .status, .confirm, .history, .error-box {
      padding: 28px 8px 12px;
    }
    .status h2, .confirm h2, .error-box h2 { margin: 0 0 8px; font-size: 1.8rem; letter-spacing: -0.04em; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .date-row { margin: 8px 0 14px; }
    label.date {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--muted);
      font-size: 0.86rem;
    }
    input[type="date"] {
      min-height: 52px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--card);
      padding: 0 12px;
      color-scheme: dark;
    }
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .choice {
      min-height: 74px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--card);
      padding: 8px 8px 10px;
      text-align: left;
      position: relative;
    }
    .choice strong {
      display: block;
      font-size: 1.7rem;
      letter-spacing: -0.05em;
      line-height: 1;
    }
    .choice span { display: block; margin-top: 6px; color: var(--muted); font-size: 0.78rem; line-height: 1.2; }
    .choice.is-on { background: var(--ink); color: #16140f; border-color: var(--ink); }
    .choice.is-on span { color: #4d493f; }
    .choice.is-on .badge { background: #16140f; color: var(--chalk); }
    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--chalk);
      color: #1b2208;
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .focus {
      margin: 14px 0 6px;
      color: var(--ink);
    }
    .last-line { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px;
      margin: 0 0 12px;
      box-shadow: var(--shadow);
    }
    .card.is-skipped { opacity: 0.72; box-shadow: none; }
    .card-top, .set-top, .modal-actions, .confirm-actions, .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .muscle {
      margin: 0;
      color: var(--faint);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .card h3 { margin: 2px 0 4px; font-size: 1.18rem; letter-spacing: -0.03em; }
    .hint, .source { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .source { margin-bottom: 10px; }
    .text-btn, .secondary, .primary, .icon-btn, .step {
      min-height: 48px;
      border-radius: 14px;
    }
    .text-btn { padding: 0 12px; background: var(--card-2); }
    .set {
      background: var(--card-2);
      border-radius: 16px;
      padding: 10px;
      margin-top: 8px;
    }
    .set-top { align-items: center; margin-bottom: 8px; color: var(--muted); }
    .icon-btn {
      width: 44px;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.4rem;
    }
    .grids { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grids.one { grid-template-columns: 1fr; }
    .field { display: flex; flex-direction: column; gap: 6px; color: var(--faint); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .field > span { display: block; }
    .stepper {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      min-height: 56px;
      border-radius: 14px;
      background: #12140f;
      overflow: hidden;
    }
    .step { font-size: 1.5rem; background: transparent; }
    .stepper input, .extra input {
      width: 100%;
      min-height: 48px;
      border: 0;
      background: transparent;
      text-align: center;
      font-size: 1.35rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }
    .extra { display: grid; grid-template-columns: 88px 1fr; gap: 8px; margin-top: 8px; }
    .extra input {
      text-align: left;
      padding: 0 12px;
      font-size: 1rem;
      border-radius: 12px;
      background: #12140f;
    }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .card-actions .text-btn { flex: 1; }
    html { scroll-padding-bottom: 120px; }
    .editor { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: min(560px, 100%);
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, #10110e 72%, rgba(16, 17, 14, 0));
    }
    .bar p { margin: 0 0 8px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
    .primary {
      width: 100%;
      background: var(--red);
      color: white;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .primary:disabled { opacity: 0.45; }
    .secondary { padding: 0 16px; background: var(--card-2); }
    .stat {
      margin: 18px 0;
      padding: 16px;
      border-radius: 20px;
      background: var(--card);
    }
    .stat b {
      display: block;
      font-size: 2rem;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }
    .up { color: var(--chalk); }
    .down { color: var(--down); }
    .confirm-actions, .history-top { margin-top: 16px; }
    .session {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 0;
      margin: 0 0 10px;
    }
    .session summary {
      min-height: 72px;
      padding: 12px 14px;
      cursor: pointer;
      list-style: none;
    }
    .session summary::-webkit-details-marker { display: none; }
    .session strong { display: block; }
    .detail { padding: 0 14px 12px; }
    .detail div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
    .modal[hidden] { display: none; }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      display: grid;
      place-items: end center;
      padding: 16px;
      z-index: 5;
    }
    .modal-card {
      width: min(520px, 100%);
      background: #26291f;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: calc(8px + env(safe-area-inset-bottom));
    }
    .modal-card p { margin: 0 0 14px; font-size: 1.1rem; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .alert { color: #ffd0c4; margin: 8px 0 0; }
    @media (min-width: 900px) {
      body { padding: 28px 0 40px; }
      .shell { padding-top: 8px; }
      .choices { gap: 12px; }
      .choice { min-height: 108px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="plate" aria-hidden="true"></div>
        <div>
          <p class="eyebrow">Christian</p>
          <h1>Palestra</h1>
        </div>
      </div>
      <button class="ghost" type="button" data-action="history">Storico</button>
    </header>
    <div id="setupBanner" class="banner" hidden>
      <p>Per configurare l’app, apri dal telefono il link che trovi nel foglio Google, nella scheda App.</p>
    </div>
    <div id="installBanner" class="banner" hidden>
      <p>Su Android, in Chrome: menu in alto a destra, poi «Installa app» o «Aggiungi alla schermata Home». Su iPhone, in Safari: Condividi, poi «Aggiungi a Home».</p>
      <button class="ghost" type="button" id="installApp" hidden>Installa</button>
      <button class="ghost" type="button" id="hideInstall">Ok</button>
    </div>
    <main id="app"></main>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalText">
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="secondary" type="button" id="modalNo">Annulla</button>
        <button class="primary" type="button" id="modalYes">Aggiungi</button>
      </div>
    </div>
  </div>
  <script>
    var data = null;
    var view = 'loading';
    var selected = '';
    var dateValue = '';
    var drafts = {};
    var summary = null;
    var saving = false;
    var requestId = '';
    var errorText = '';
    var modalResolver = null;

    var API_URL = "https://script.google.com/macros/s/AKfycby5BbhGQxfGqEHD71yl8Z3csntO-mlf7LZrXSHkl1_fnCODC8oJUBCTf-2LIdjrZAE/exec";
    var TOKEN_KEY = 'palestra-token';

    function captureToken() {
      var hash = String(window.location.hash || '');
      if (!hash) return;
      var raw = hash.charAt(0) === '#' ? hash.slice(1) : hash;
      var parts = raw.split('&');
      var i;
      for (i = 0; i < parts.length; i++) {
        var pair = parts[i];
        var eq = pair.indexOf('=');
        var key = eq >= 0 ? pair.slice(0, eq) : pair;
        var val = eq >= 0 ? pair.slice(eq + 1) : '';
        if (key === 't' && val) {
          try { localStorage.setItem(TOKEN_KEY, decodeURIComponent(val)); } catch (err) {}
          history.replaceState(null, '', window.location.pathname + window.location.search);
          return;
        }
      }
    }

    function getToken() {
      try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (err) { return ''; }
    }

    function rpc(name, arg) {
      var token = getToken();
      if (!token) {
        return Promise.reject(new Error('Per configurare l’app, apri dal telefono il link che trovi nel foglio Google, nella scheda App.'));
      }
      var body = { token: token, action: name };
      if (arg !== undefined) body.payload = arg;
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
        redirect: 'follow',
        credentials: 'omit'
      }).then(function (res) {
        return res.text().then(function (text) {
          var data;
          try { data = JSON.parse(text); } catch (err) {
            throw new Error(res.ok ? 'Risposta non valida dal foglio.' : 'Il server ha risposto ' + res.status + '.');
          }
          if (!res.ok && (!data || data.ok !== false)) {
            throw new Error((data && data.error) || ('Il server ha risposto ' + res.status + '.'));
          }
          return data;
        });
      });
    }

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function parseNum(value) {
      if (value == null) return null;
      var text = String(value).trim().replace(/\s/g, '').replace(',', '.');
      if (!text) return null;
      var n = Number(text);
      return Number.isFinite(n) ? n : null;
    }

    function formatEditable(n) {
      var rounded = Math.round(Number(n) * 100) / 100;
      if (!Number.isFinite(rounded)) return '';
      return rounded.toFixed(2).replace(/\.?0+$/, '').replace('.', ',');
    }

    function itNum(n) {
      return new Intl.NumberFormat('it-IT', { maximumFractionDigits: 1 }).format(n);
    }

    function itDate(iso) {
      var parts = String(iso || '').split('-').map(Number);
      if (parts.length !== 3) return iso || '';
      return new Intl.DateTimeFormat('it-IT', {
        weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Europe/Rome'
      }).format(new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 12)));
    }

    function newRequestId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    function workoutOf(code) {
      return data.workouts.find(function (item) { return item.code === code; });
    }

    function ensureDraft(code) {
      if (drafts[code]) return drafts[code];
      var workout = workoutOf(code);
      drafts[code] = workout.exercises.map(function (ex) {
        return {
          name: ex.name,
          muscle: ex.muscle,
          hint: ex.hint,
          kind: ex.kind,
          source: ex.source,
          skipped: false,
          sets: ex.sets.map(function (set) {
            return {
              reps: set.reps == null ? '' : formatEditable(set.reps),
              kg: set.kg == null ? '' : formatEditable(set.kg),
              rir: set.rir || '',
              note: set.note || ''
            };
          })
        };
      });
      return drafts[code];
    }

    function draftStats(list) {
      var sets = 0;
      var tonnage = 0;
      list.forEach(function (ex) {
        if (ex.skipped) return;
        ex.sets.forEach(function (set) {
          sets += 1;
          var reps = parseNum(set.reps);
          var kg = parseNum(set.kg);
          if (reps != null && kg != null) tonnage += reps * kg;
        });
      });
      return { sets: sets, tonnage: Math.round(tonnage * 10) / 10 };
    }

    function seriesWord(n) {
      return n === 1 ? '1 serie' : n + ' serie';
    }

    function deltaSentence(item) {
      if (!item.previous) return 'Prima sessione di questo tipo nel diario.';
      if (!item.delta) return 'Stesso tonnellaggio dell’ultima sessione.';
      var sign = item.delta > 0 ? '+' : '';
      return sign + itNum(item.delta) + ' kg rispetto al ' + itDate(item.previous.date) + '.';
    }

    function render(keepScroll) {
      var y = keepScroll ? window.scrollY : 0;
      document.getElementById('app').innerHTML = paint();
      if (keepScroll) window.scrollTo(0, y);
      else window.scrollTo(0, 0);
    }

    function paint() {
      if (view === 'loading') return '<section class="status"><h2>Carico la scheda…</h2><p class="muted">Leggo il diario e preparo i carichi dell’ultima volta.</p></section>';
      if (view === 'error') {
        return '<section class="error-box"><h2>Qualcosa non ha risposto</h2><p>' + esc(errorText) + '</p><button class="primary" type="button" data-action="retry">Riprova</button></section>';
      }
      if (view === 'history') return paintHistory();
      if (view === 'confirm') return paintConfirm();
      return paintEditor();
    }

    function paintEditor() {
      var workout = workoutOf(selected);
      var list = ensureDraft(selected);
      var stats = draftStats(list);
      var choices = data.workouts.map(function (item) {
        var on = item.code === selected ? ' is-on' : '';
        var badge = item.code === data.suggested ? '<em class="badge">Prossimo</em>' : '';
        return '<button class="choice' + on + '" type="button" data-action="pick" data-code="' + item.code + '" aria-pressed="' + (item.code === selected) + '">' +
          badge + '<strong>' + item.code + '</strong><span>' + esc(item.short) + '</span></button>';
      }).join('');
      var last = data.last
        ? 'Ultimo nel diario: ' + esc(data.last.code) + ' · ' + esc(itDate(data.last.date)) + '. Adesso tocca a ' + esc(data.suggested) + '.'
        : 'Nessuna sessione nel diario. Si parte dalla scheda A.';
      var previous = workout.previous
        ? 'Ultima volta ' + esc(itDate(workout.previous.date)) + ' · ' + esc(seriesWord(workout.previous.sets)) + ' · ' + esc(itNum(workout.previous.tonnage)) + ' kg'
        : 'Questa scheda non è ancora nel diario.';
      var cards = list.map(function (ex, index) { return paintExercise(ex, index); }).join('');
      var preview = '';
      if (workout.previous) {
        var delta = Math.round((stats.tonnage - workout.previous.tonnage) * 10) / 10;
        var cls = delta > 0 ? 'up' : delta < 0 ? 'down' : '';
        var sign = delta > 0 ? '+' : '';
        preview = '<span class="' + cls + '"> · ' + sign + itNum(delta) + ' kg</span>';
      }
      var alert = errorText ? '<p class="alert" role="alert">' + esc(errorText) + '</p>' : '';
      return '<section class="editor">' +
        '<div class="date-row"><label class="date">Data<input id="session-date" name="data" type="date" data-field="date" value="' + esc(dateValue) + '"></label></div>' +
        '<div class="choices" role="radiogroup" aria-label="Scheda">' + choices + '</div>' +
        '<p class="focus">' + esc(workout.focus) + '</p>' +
        '<p class="last-line">' + last + '<br>' + previous + '</p>' +
        cards + alert +
        '<div class="bar"><p id="barStats">' + esc(seriesWord(stats.sets)) + ' · ' + esc(itNum(stats.tonnage)) + ' kg' + preview + '</p>' +
        '<button class="primary" id="saveBtn" type="button" data-action="save"' + (saving || stats.sets === 0 ? ' disabled' : '') + '>' +
        (saving ? 'Salvo…' : 'Salva sessione') + '</button></div></section>';
    }

    function paintExercise(ex, index) {
      if (ex.skipped) {
        return '<article class="card is-skipped"><div class="card-top"><div><p class="muscle">' + esc(ex.muscle || 'Extra') + '</p><h3>' + esc(ex.name) + '</h3><p class="hint">Saltato, non va nel diario.</p></div>' +
          '<button class="text-btn" type="button" data-action="skip" data-ex="' + index + '">Riprendi</button></div></article>';
      }
      var cardio = ex.kind === 'cardio';
      var sets = ex.sets.map(function (set, setIndex) {
        var kg = cardio ? '' : '<div class="field"><span>Kg</span><div class="stepper"><button class="step" type="button" data-action="step" data-ex="' + index + '" data-set="' + setIndex + '" data-field="kg" data-delta="-1" aria-label="Diminuisci il carico, serie ' + (setIndex + 1) + '">−</button><input name="kg-' + index + '-' + setIndex + '" inputmode="decimal" data-ex="' + index + '" data-set="' + setIndex + '" data-field="kg" value="' + esc(set.kg) + '" aria-label="Chilogrammi serie ' + (setIndex + 1) + '"><button class="step" type="button" data-action="step" data-ex="' + index + '" data-set="' + setIndex + '" data-field="kg" data-delta="1" aria-label="Aumenta il carico, serie ' + (setIndex + 1) + '">+</button></div></div>';
        return '<div class="set"><div class="set-top"><span>Serie ' + (setIndex + 1) + '</span>' +
          (ex.sets.length > 1 ? '<button class="icon-btn" type="button" data-action="remove" data-ex="' + index + '" data-set="' + setIndex + '" aria-label="Togli serie ' + (setIndex + 1) + '">×</button>' : '<span></span>') +
          '</div><div class="grids' + (cardio ? ' one' : '') + '">' +
          '<div class="field"><span>' + (cardio ? 'Minuti' : 'Rip') + '</span><div class="stepper"><button class="step" type="button" data-action="step" data-ex="' + index + '" data-set="' + setIndex + '" data-field="reps" data-delta="-1" aria-label="Diminuisci, serie ' + (setIndex + 1) + '">−</button><input name="rip-' + index + '-' + setIndex + '" inputmode="decimal" data-ex="' + index + '" data-set="' + setIndex + '" data-field="reps" value="' + esc(set.reps) + '" aria-label="' + (cardio ? 'Minuti' : 'Ripetizioni') + ' serie ' + (setIndex + 1) + '"><button class="step" type="button" data-action="step" data-ex="' + index + '" data-set="' + setIndex + '" data-field="reps" data-delta="1" aria-label="Aumenta, serie ' + (setIndex + 1) + '">+</button></div></div>' +
          kg + '</div><div class="extra"><input name="rir-' + index + '-' + setIndex + '" data-ex="' + index + '" data-set="' + setIndex + '" data-field="rir" value="' + esc(set.rir) + '" placeholder="RIR" aria-label="RIR serie ' + (setIndex + 1) + '" maxlength="24"><input name="nota-' + index + '-' + setIndex + '" data-ex="' + index + '" data-set="' + setIndex + '" data-field="note" value="' + esc(set.note) + '" placeholder="' + (cardio ? 'Velocità, pendenza…' : 'Nota') + '" aria-label="Nota serie ' + (setIndex + 1) + '" maxlength="300"></div></div>';
      }).join('');
      var source = ex.source === 'log' ? 'Come l’ultima volta' : 'Dalla scheda: nel diario non c’è ancora';
      var hint = ex.hint ? '<p class="hint">' + esc(ex.hint) + '</p>' : '';
      return '<article class="card"><div class="card-top"><div><p class="muscle">' + esc(ex.muscle || 'Extra') + '</p><h3>' + esc(ex.name) + '</h3>' + hint + '</div>' +
        '<button class="text-btn" type="button" data-action="skip" data-ex="' + index + '">Salta</button></div>' +
        '<p class="source">' + source + '</p>' + sets +
        '<div class="card-actions"><button class="text-btn" type="button" data-action="add" data-ex="' + index + '">Aggiungi serie</button></div></article>';
    }

    function paintConfirm() {
      var cls = summary.delta > 0 ? 'up' : summary.delta < 0 ? 'down' : '';
      return '<section class="confirm"><p class="eyebrow">Registrato</p><h2>' + esc(summary.code) + ' · ' + esc(itDate(summary.date)) + '</h2>' +
        '<div class="stat"><b>' + esc(seriesWord(summary.sets)) + '</b><span class="muted">' + esc(itNum(summary.tonnage)) + ' kg di tonnellaggio</span></div>' +
        '<p class="' + cls + '">' + esc(deltaSentence(summary)) + '</p>' +
        '<p class="muted">Le serie sono in fondo al foglio Log, con le formule già compilate. Oggi e Storico si aggiornano da soli.</p>' +
        '<div class="confirm-actions"><button class="primary" type="button" data-action="again">Nuova sessione</button></div>' +
        '<div class="confirm-actions"><button class="secondary" type="button" data-action="history">Vedi lo storico</button></div></section>';
    }

    function paintHistory() {
      var sessions = (data && data.recent) || [];
      var body = sessions.length ? sessions.map(function (session) {
        var lines = (session.detail || []).map(function (item) {
          return '<div><span>' + esc(item.name) + '</span><span>' + item.sets + ' × · ' + esc(itNum(item.tonnage)) + ' kg</span></div>';
        }).join('');
        return '<details class="session"><summary><strong>' + esc(session.code) + ' · ' + esc(itDate(session.date)) + '</strong><span class="muted">' + esc(seriesWord(session.sets)) + ' · ' + esc(itNum(session.tonnage)) + ' kg</span></summary><div class="detail">' + lines + '</div></details>';
      }).join('') : '<p class="muted">Nessuna sessione nel diario.</p>';
      return '<section class="history"><div class="history-top"><h2>Ultime sessioni</h2><button class="ghost" type="button" data-action="back">Chiudi</button></div>' + body + '</section>';
    }

    function updateBar() {
      var stats = draftStats(ensureDraft(selected));
      var bar = document.getElementById('barStats');
      var workout = workoutOf(selected);
      if (!bar || !workout) return;
      var preview = '';
      if (workout.previous) {
        var delta = Math.round((stats.tonnage - workout.previous.tonnage) * 10) / 10;
        var sign = delta > 0 ? '+' : '';
        preview = ' · ' + sign + itNum(delta) + ' kg';
      }
      bar.textContent = seriesWord(stats.sets) + ' · ' + itNum(stats.tonnage) + ' kg' + preview;
      var button = document.getElementById('saveBtn');
      if (button && !saving) button.disabled = stats.sets === 0;
    }

    function onInput(event) {
      var target = event.target;
      if (!target.dataset) return;
      if (target.dataset.field === 'date') {
        dateValue = target.value;
        errorText = '';
        return;
      }
      if (target.dataset.ex == null || target.dataset.set == null) return;
      var list = ensureDraft(selected);
      list[Number(target.dataset.ex)].sets[Number(target.dataset.set)][target.dataset.field] = target.value;
      updateBar();
    }

    function onClick(event) {
      var button = event.target.closest('[data-action]');
      if (!button || button.disabled) return;
      var action = button.dataset.action;
      if (action === 'history') { view = 'history'; errorText = ''; render(); return; }
      if (action === 'back' || action === 'again') { view = 'editor'; errorText = ''; render(); return; }
      if (action === 'retry') { boot(); return; }
      if (action === 'pick') { selected = button.dataset.code; errorText = ''; render(true); return; }
      if (action === 'skip') {
        var skipped = ensureDraft(selected)[Number(button.dataset.ex)];
        skipped.skipped = !skipped.skipped;
        render(true);
        return;
      }
      if (action === 'add') {
        var exercise = ensureDraft(selected)[Number(button.dataset.ex)];
        var last = exercise.sets[exercise.sets.length - 1] || { reps: '', kg: '', rir: '', note: '' };
        exercise.sets.push({ reps: last.reps, kg: last.kg, rir: last.rir, note: last.note });
        render(true);
        return;
      }
      if (action === 'remove') {
        var target = ensureDraft(selected)[Number(button.dataset.ex)];
        if (target.sets.length < 2) return;
        target.sets.splice(Number(button.dataset.set), 1);
        render(true);
        return;
      }
      if (action === 'step') {
        var set = ensureDraft(selected)[Number(button.dataset.ex)].sets[Number(button.dataset.set)];
        var field = button.dataset.field;
        var current = parseNum(set[field]);
        var next = (current == null ? 0 : current) + Number(button.dataset.delta);
        if (next < 0) next = 0;
        if (field === 'reps') next = Math.round(next);
        else next = Math.round(next * 10) / 10;
        set[field] = formatEditable(next);
        render(true);
        return;
      }
      if (action === 'save') save(false);
    }

    function ask(message) {
      return new Promise(function (resolve) {
        modalResolver = resolve;
        document.getElementById('modalText').textContent = message;
        document.getElementById('modal').hidden = false;
      });
    }

    function closeModal(answer) {
      document.getElementById('modal').hidden = true;
      var resolve = modalResolver;
      modalResolver = null;
      if (resolve) resolve(answer);
    }

    async function save(confirmDuplicate) {
      if (saving) return;
      var list = ensureDraft(selected);
      if (!draftStats(list).sets) return;
      if (!requestId) requestId = newRequestId();
      saving = true;
      errorText = '';
      render(true);
      var res;
      try {
        res = await rpc('saveSession', {
          requestId: requestId,
          date: dateValue,
          workout: selected,
          confirmDuplicate: !!confirmDuplicate,
          exercises: list.map(function (ex) {
            return {
              name: ex.name,
              skipped: !!ex.skipped,
              sets: ex.sets.map(function (set) {
                return { reps: set.reps, kg: set.kg, rir: set.rir, note: set.note };
              })
            };
          })
        });
      } catch (err) {
        saving = false;
        errorText = (err && err.message) || 'Salvataggio non riuscito. Riprova: la stessa pressione non scrive due volte.';
        render(true);
        return;
      }
      if (res && res.needsConfirm) {
        saving = false;
        render(true);
        var yes = await ask(res.message);
        if (!yes) return;
        return save(true);
      }
      saving = false;
      if (!res || !res.ok) {
        errorText = (res && res.error) || 'Salvataggio non riuscito.';
        render(true);
        return;
      }
      summary = res.summary;
      delete drafts[selected];
      if (res.state) {
        var keepDate = dateValue;
        data = res.state;
        dateValue = keepDate;
        selected = data.suggested || selected;
      }
      requestId = '';
      view = 'confirm';
      render();
    }

    async function boot() {
      view = 'loading';
      errorText = '';
      render();
      try {
        var state = await rpc('getState');
        if (!state || state.ok === false) throw new Error((state && state.error) || 'Non riesco a leggere il foglio.');
        data = state;
        if (!dateValue) dateValue = state.today;
        selected = state.suggested || 'A';
        view = 'editor';
      } catch (err) {
        view = 'error';
        errorText = (err && err.message) || 'Non riesco a leggere il foglio.';
      }
      render();
    }

    document.body.addEventListener('click', onClick);
    document.body.addEventListener('input', onInput);
    document.getElementById('modalYes').addEventListener('click', function () { closeModal(true); });
    document.getElementById('modalNo').addEventListener('click', function () { closeModal(false); });
    document.getElementById('hideInstall').addEventListener('click', function () {
      try { localStorage.setItem('palestra-install-off', '1'); } catch (err) {}
      document.getElementById('installBanner').hidden = true;
    });

    captureToken();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }

    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      deferredPrompt = event;
      var installBtn = document.getElementById('installApp');
      if (installBtn) installBtn.hidden = false;
    });
    document.getElementById('installApp').addEventListener('click', function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt = null;
      document.getElementById('installApp').hidden = true;
    });

    var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var installOff = false;
    try { installOff = localStorage.getItem('palestra-install-off') === '1'; } catch (err) { installOff = false; }
    if (mobile && !standalone && !installOff) document.getElementById('installBanner').hidden = false;

    if (!getToken()) {
      document.getElementById('setupBanner').hidden = false;
      view = 'error';
      errorText = 'Per configurare l’app, apri dal telefono il link che trovi nel foglio Google, nella scheda App.';
      render();
    } else {
      boot();
    }
  </script>
</body>
</html>
